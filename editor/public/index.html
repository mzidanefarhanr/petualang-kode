<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" value="notranslate">
    <title>Editor Scratch</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        min-width: 1024px;
        min-height: 640px;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 12px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        font-size: 14px;
      }
      #bar-title {
        font-weight: 600;
        color: #1e3a8a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 22rem;
      }
      #bar .spacer {
        flex: 1;
      }
      #status {
        color: #475569;
        white-space: nowrap;
      }
      #bar button {
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 14px;
        cursor: pointer;
      }
      #btn-kumpul {
        background: #1e3a8a;
        color: #ffffff;
        border: none;
      }
      #btn-kumpul:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #btn-save {
        background: #ffffff;
        color: #334155;
        border: 1px solid #cbd5e1;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #scratch-editor {
        width: 100%;
        height: 100%;
      }
      .notis {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        background: #fffbeb;
        border: 1px solid #fde68a;
        color: #92400e;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
      }
      .fatal {
        max-width: 32rem;
        margin: 80px auto;
        padding: 24px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        background: #ffffff;
      }
      .fatal h1 {
        font-size: 18px;
        margin: 0 0 8px;
        color: #1e3a8a;
      }
      .fatal a {
        color: #1e3a8a;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <header id="bar" hidden>
        <button id="btn-kumpul" type="button" hidden>Kumpulkan</button>
        <div id="bar-title">Memuat…</div>
        <div class="spacer"></div>
        <span id="status">Memuat editor…</span>
        <button id="btn-save" type="button" hidden>Simpan</button>
      </header>
      <main id="stage"></main>
    </div>
    <script src="./config.js"></script>
    <script src="./scratch-gui-standalone.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
